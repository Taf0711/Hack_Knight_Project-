version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: greenwash_db
    environment:
      POSTGRES_USER: greenwash
      POSTGRES_PASSWORD: greenwash123
      POSTGRES_DB: greenwash_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greenwash"]
      interval: 10s
      timeout: 5s
      retries: 5

  python-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: greenwash_api
    environment:
      DATABASE_URL: postgresql://greenwash:greenwash123@postgres:5432/greenwash_db
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  nextjs:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: greenwash_frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000
      PYTHON_API_URL: http://python-api:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - python-api
    command: npm run dev

volumes:
  postgres_data:

